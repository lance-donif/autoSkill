name: Diagnose released Windows browser launches
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  windows-report:
    name: Compare published Windows packages on one native runner
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate (Windows)
    env:
      AUTOSKILL_HEADED: '0'
      AUTOSKILL_REPORT_BASELINE: ${{ github.workspace }}\control (v2.5.1)\skills\autoskill\app
      PYTHONPATH: tests
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        path: candidate (Windows)
        sparse-checkout: 'skills/autoskill

          tests

          '
    - uses: actions/checkout@v4
      with:
        ref: ad795dd1837bc2103704bdff713bf70cb780411b
        path: control (v2.5.1)
        sparse-checkout: skills/autoskill
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install selected contract dependencies from project pins
      shell: bash
      run: "python - <<'PY'\nimport re\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nnames = {\"httpx\", \"h11\", \"locust\"\
        , \"jsonschema\", \"openpyxl\", \"fastapi\", \"starlette\", \"pydantic\", \"uvicorn\", \"cryptography\"}\nlines = \"\\n\".join(Path(name).read_text()\
        \ for name in (\"requirements.txt\", \"requirements-linux.txt\"))\nrequirements = [line for line in lines.splitlines() if re.split(r\"\
        [\\[=]\", line)[0] in names]\nif len(requirements) != len(names):\n    raise SystemExit(\"Required contract dependency pin missing\
        \ or duplicated\")\nsubprocess.run([sys.executable, \"-m\", \"pip\", \"install\", \"--disable-pip-version-check\", *requirements],\
        \ check=True)\nPY\n"
    - name: Compare native file handles, v2.5.1 receipts, HTTP bridge and Windows permissions
      run: '$suite = ''test_windows_report_delivery.ReportDeliveryTests''

        python -m unittest -v "$suite.test_native_descriptor_access_modes" "$suite.test_existing_v251_report_retries_after_upgrade"
        "$suite.test_direct_and_http_bridge_create_readable_designs" "$suite.test_windows_acl_and_open_workbook_allow_retry_on_same_id"

        '
    - name: Preserve delivered project archives, Windows access control and open readers on retry
      run: '$suite = ''test_artifact_share.ArtifactShareTests''

        python -m unittest -v "$suite.test_replacement_preserves_windows_dacl_and_open_readers" "$suite.test_failed_project_pack_preserves_the_delivered_file_and_leaves_no_partial_output"
        "$suite.test_failed_full_pack_keeps_the_previous_archive_until_the_source_is_repaired"

        '
    - name: Verify shared evidence reads and same-size changes on Windows
      env:
        AUTOSKILL_EXPECT_NTFS_CHANGE_TIME: '1'
      run: '$suite = ''test_state_api.StateApiTests''

        python -m unittest -v "$suite.test_history_and_dashboard_check_each_distinct_source_once_per_cold_response" "$suite.test_source_replaced_between_result_verdicts_is_rechecked_within_one_response"
        "$suite.test_same_size_source_edit_with_restored_mtime_rechecks_dashboard_and_report"

        '
    - name: Prepare the pinned recorder and Python driver for the local fixture
      run: '$pins = (Select-String -Path requirements.txt -Pattern ''^(playwright|selenium|pillow)=='').Line

        python -m pip install --disable-pip-version-check @pins

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $prefix = Join-Path $env:RUNNER_TEMP ''report-browser''

        npm install --prefix $prefix --offline=false --ignore-scripts --no-audit --no-fund ''@agent-browser/cli-win32-x64-msvc@0.43.0''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $binary = (Get-Item "$prefix\node_modules\@agent-browser\cli-win32-x64-msvc\bin\agent-browser.exe").FullName

        $chrome = (Get-Item "$env:ProgramFiles\Google\Chrome\Application\chrome.exe").FullName

        & $binary --version

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        "AUTOSKILL_AGENT_BROWSER=$binary" >> $env:GITHUB_ENV

        "AUTOSKILL_CHROMIUM=$chrome" >> $env:GITHUB_ENV

        '
    - name: Test the documented arguments, recording and report delivery in both native shells
      run: 'powershell.exe -NoProfile -Command ''$PSVersionTable.PSVersion.ToString()''

        pwsh.exe -NoProfile -Command ''$PSVersionTable.PSVersion.ToString()''

        $suite = ''test_windows_report_delivery.ReportDeliveryTests''

        python -m unittest -v "$suite.test_windows_powershell_51_cmd_with_direct_recording" "$suite.test_powershell_7_cmd_through_http_bridge"
        "$suite.test_v251_recording_and_run_reports_retry_without_replay"

        '
    - name: Diagnose v2.5.3 from its anonymous public download
      id: current
      continue-on-error: true
      run: python tests/windows-doctor-diagnostic.py --tag v2.5.3
    - name: Compare v2.5.2 from its anonymous public download on this runner
      id: prior
      continue-on-error: true
      run: python tests/windows-doctor-diagnostic.py --tag v2.5.2
    - name: Retain traces, receipts and process evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-doctor-diagnostics
        path: ${{ github.workspace }}/doctor-proof-*/**
        if-no-files-found: warn
        retention-days: 7
    - name: Report the candidate result
      if: always()
      env:
        CANDIDATE_RESULT: ${{ steps.current.outcome }}
      run: if ($env:CANDIDATE_RESULT -ne 'success') { throw 'Inspect candidate traces and comparison before publication claims.' }
    if: github.ref == 'refs/heads/diagnostics/v2.5.3-windows-doctor'
