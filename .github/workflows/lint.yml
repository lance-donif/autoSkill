name: Compare native Windows cookie reset and business flows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    if: github.ref == 'refs/heads/diagnostics/v2.5.3-windows-doctor'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare isolated Selenium sessions and the real business commands in the public Windows package
        run: python tests/windows_reset_experiment.py
      - name: Retain exact receipts and bounded traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cookie-reset-evidence
          path: ${{ github.workspace }}/reset-evidence
          if-no-files-found: warn
          retention-days: 7
