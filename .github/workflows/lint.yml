name: Static checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  landmines:
    name: Landmines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/landmines/package-lock.json
      - name: Install locked analysis tools
        run: npm ci --prefix .github/landmines --offline=false --include=dev --ignore-scripts --no-audit --no-fund
      - name: Scan JavaScript and TypeScript
        id: scan
        run: npm run --silent lint:landmines -- --format json > "$RUNNER_TEMP/landmines.json"
      - name: Summarize findings
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        run: python scripts/landmines_summary.py "$RUNNER_TEMP/landmines.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        with:
          name: landmines-report
          path: ${{ runner.temp }}/landmines.json
          if-no-files-found: error
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision pinned linters for CI
        env:
          npm_config_offline: 'false'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "ruff==0.17.4"], check=True)
          prefix = str(Path(os.environ["RUNNER_TEMP"]) / "review-tools")
          subprocess.run(["npm", "install", "--prefix", prefix, "--no-audit", "--no-fund", "@biomejs/biome@2.6.7"], check=True)
          PY
      - name: Lint, project conventions and review tooling
        if: always()
        run: python scripts/validate_review.py --suite lint --suite conventions --suite review-tools --biome "$RUNNER_TEMP/review-tools/node_modules/.bin/biome" --output-dir "$RUNNER_TEMP/review-lint" --show-logs
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTOSKILL_HEADED: '0'
      AUTOSKILL_BRIDGE: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install selected contract dependencies from project pins
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          names = {"httpx", "locust", "jsonschema", "openpyxl", "fastapi", "starlette", "pydantic", "uvicorn", "cryptography"}
          lines = "\n".join(Path(name).read_text() for name in ("requirements.txt", "requirements-linux.txt"))
          requirements = [line for line in lines.splitlines() if re.split(r"[\[=]", line)[0] in names]
          if len(requirements) != len(names):
              raise SystemExit("Required contract dependency pin missing or duplicated")
          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", *requirements], check=True)
          PY
      - name: Workflow, diagnosis, knowledge and host contracts
        if: always()
        run: python scripts/validate_review.py --suite workflow --suite knowledge --suite host --output-dir "$RUNNER_TEMP/review-contracts" --show-logs
      - name: Check report evidence, load scheduling and JMeter statistics
        run: |
          PYTHONPATH=tests python -m unittest -v test_preview_observation_steps test_report_step_definitions test_load_testing test_load_report_evidence test_load_modes
          node --test tests/preview-runs.test.mjs tests/load-dashboard.test.mjs
  dashboard-e2e:
    name: Dashboard E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned browser and local dashboard dependencies
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          names = {"playwright", "httpx", "locust", "jsonschema", "openpyxl", "fastapi", "starlette", "pydantic", "uvicorn", "cryptography"}
          lines = (Path("requirements.txt").read_text() + "\n" + Path("requirements-linux.txt").read_text()).splitlines()
          pins = [line for line in lines if re.split(r"[\[=]", line)[0] in names]
          if len(pins) != len(names):
              raise SystemExit("Browser test dependency pin missing or duplicated")
          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", *pins], check=True)
          PY
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p, open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"AUTOSKILL_CHROMIUM={p.chromium.executable_path}\n")
          PY
      - name: Check dashboard flows, reports and both load modes in Chromium
        env:
          AUTOSKILL_VALIDATION_OUTPUT: ${{ runner.temp }}/dashboard-e2e
        run: PYTHONPATH=tests python -m unittest -v test_pages_browser test_dashboard_palette test_pages_load test_load_dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-e2e-diagnostics
          path: ${{ runner.temp }}/dashboard-e2e
          if-no-files-found: warn
