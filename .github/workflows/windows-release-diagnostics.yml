name: Windows release diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic to run
        type: choice
        default: cookie-reset
        options: [cookie-reset, doctor]
      release_tag:
        description: Published version for doctor mode
        type: string
        default: v2.5.3
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare cookie resets and replay on the published v2.5.3 package
        if: inputs.mode == 'cookie-reset'
        run: python tests/windows_reset_experiment.py
      - name: Trace browser launches and run the published package smoke
        if: inputs.mode == 'doctor'
        env:
          DIAGNOSTIC_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:DIAGNOSTIC_RELEASE_TAG -eq 'v2.5.3') {
            $pin = (Select-String -Path requirements.txt -Pattern '^openpyxl==').Line
            python -m pip install --disable-pip-version-check $pin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/windows_doctor_diagnostic.py --tag $env:DIAGNOSTIC_RELEASE_TAG
      - name: Retain receipts and bounded traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-diagnostic-evidence
          path: |
            reset-evidence/
            doctor-proof-*/
          if-no-files-found: warn
          retention-days: 7
