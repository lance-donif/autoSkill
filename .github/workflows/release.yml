name: Build and publish platform offline packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build when running from main
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: platform-offline-release
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  AUTOSKILL_HEADED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  STAGING_TAG: autoskill-build-${{ github.run_id }}
jobs:
  staging:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.sha || format('refs/tags/{0}', inputs.release_tag) }}
      - name: Pin every build to the release source
        id: source
        run: |
          test "$RELEASE_TAG" = "v$(jq -r .version package.json)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare a private draft for native package transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$STAGING_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft > /dev/null 2>&1; then
            test "$(gh release view "$STAGING_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$STAGING_TAG" --repo "$RELEASE_REPOSITORY" --draft --title "$RELEASE_TAG build $RELEASE_RUN_ID" --notes "Platform package transfer for $RELEASE_TAG."
          fi
  windows:
    needs: staging
    env:
      RELEASE_COMMIT: ${{ needs.staging.outputs.commit }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.staging.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Windows x64 package (no functional regression)
        shell: pwsh
        run: |
          python scripts/record-release-progress.py --stage building
          $build = Join-Path $env:RUNNER_TEMP 'autoskill-windows'
          python scripts/fetch-windows-assets.py --assets "$build/assets" --chrome-version 157.0.8103.78
          if ($LASTEXITCODE -ne 0) { throw 'Asset fetch failed' }
          python scripts/build-windows-bundle.py --assets "$build/assets" --output "$build/package" --zip
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Stage Windows package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$STAGING_TAG" "$RUNNER_TEMP"/autoskill-windows/autoSkill-*.zip --clobber
  linux:
    needs: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.staging.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build native Linux package
        run: |
          python scripts/fetch-linux-assets.py --assets "$RUNNER_TEMP/autoskill-linux/assets" --arch '${{ matrix.arch }}'
          python scripts/build-linux-bundle.py --assets "$RUNNER_TEMP/autoskill-linux/assets" --output "$RUNNER_TEMP/autoskill-linux/package" --arch '${{ matrix.arch }}' --zip
      - name: Verify Linux package configuration with the bundled browser and driver
        run: AUTOSKILL_WORKSPACE="$RUNNER_TEMP/autoskill-linux-config-check" sh "$RUNNER_TEMP/autoskill-linux/package/setup-linux.sh"
      - name: Require real Linux x64 browser and knowledge validation
        if: matrix.arch == 'x64'
        shell: bash
        timeout-minutes: 15
        run: |
          runtime="$RUNNER_TEMP/autoskill-linux/package/autoskill/vendor/linux-x64"
          export AUTOSKILL_CHROMIUM="$runtime/chrome/chrome-linux64/chrome"
          export AUTOSKILL_CHROMEDRIVER="$runtime/chromedriver/chromedriver-linux64/chromedriver"
          export AUTOSKILL_AGENT_BROWSER="$runtime/agent-browser/agent-browser"
          export AUTOSKILL_BRIDGE=off
          if ! command -v xwininfo || ! command -v xprop; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -y install --no-install-recommends x11-utils
          fi
          # Ubuntu 24.04 requires an AppArmor userns permission for a portable Chrome binary.
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns && "$(< /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo apparmor_parser -r <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile autoskill-release-chrome "$AUTOSKILL_CHROMIUM" flags=(unconfined) {
            userns,
          }
          PROFILE
          fi
          xvfb-run -a -s '-screen 0 1600x900x24' "$runtime/python/bin/python3" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/autoskill-linux-browser-validation.log"
          import os
          import subprocess
          import sys
          import unittest
          from pathlib import Path

          for name in ("AUTOSKILL_CHROMIUM", "AUTOSKILL_CHROMEDRIVER", "AUTOSKILL_AGENT_BROWSER"):
              executable = Path(os.environ[name])
              if not executable.is_file() or not os.access(executable, os.X_OK):
                  raise SystemExit("Required bundled runtime missing: " + name)
              subprocess.run([str(executable), "--version"], check=True, timeout=15)
          suite = unittest.TestSuite()
          for pattern in ("test_knowledge_browser.py", "test_native_evidence.py", "test_load_modes.py"):
              if not (Path("tests") / pattern).is_file():
                  raise SystemExit("Missing release validation suite: " + pattern)
              found = unittest.defaultTestLoader.discover("tests", pattern=pattern)
              if not found.countTestCases():
                  raise SystemExit("Empty release validation suite: " + pattern)
              suite.addTests(found)
          recorder = "test_recorder_browser_compatibility.RecorderBrowserCompatibilityTests."
          suite.addTests(unittest.defaultTestLoader.loadTestsFromNames([
              recorder + "test_snapshot_hints_distinguish_same_name_buttons_and_preserve_replay",
              recorder + "test_saved_setup_stays_on_the_page_and_preserves_the_selected_source_revision",
              recorder + "test_default_and_explicit_recording_create_mapped_owned_windows",
          ]))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              raise SystemExit("Release browser validation must execute, not skip")
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Stage Linux package and validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/autoskill-linux/autoSkill-*.zip)
          if [[ "${{ matrix.arch }}" == x64 ]]; then files+=("$RUNNER_TEMP/autoskill-linux-browser-validation.log"); fi
          gh release upload "$STAGING_TAG" "${files[@]}" --clobber
  publish:
    needs: [staging, windows, linux]
    if: always() && needs.staging.result == 'success'
    env:
      RELEASE_COMMIT: ${{ needs.staging.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.staging.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require all three packages
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: test "$WINDOWS_RESULT" = success && test "$LINUX_RESULT" = success
      - name: Download native packages and the Linux browser validation log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$STAGING_TAG" --pattern 'autoSkill-*.zip' --dir "$RUNNER_TEMP/autoskill-bundles"
          gh release download "$STAGING_TAG" --pattern 'autoskill-linux-browser-validation.log' --dir "$RUNNER_TEMP/autoskill-release-proof"
      - name: Verify all uploads before replacement and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/record-release-progress.py --stage publishing
          python scripts/publish-release.py --build "$RUNNER_TEMP/autoskill-bundles" --proof "$RUNNER_TEMP/autoskill-release-proof" --result "$RUNNER_TEMP/autoskill-release-result"
      - name: Record publication result on main
        if: always()
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          python scripts/record-release-result.py --result "$RUNNER_TEMP/autoskill-release-result" --proof "$RUNNER_TEMP/autoskill-release-proof"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports docs
          if ! git diff --cached --quiet; then
            git commit -m "docs: record $RELEASE_TAG platform release result"
            git push origin main
          fi
      - name: Remove the draft after publication and evidence recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$STAGING_TAG" --json isDraft --jq .isDraft)" = true
          gh release delete "$STAGING_TAG" --yes
